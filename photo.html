<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title> PHOTOGRAPHY </title>
<style>
	body {
		background: white;
	} * {
		margin: 0;
		padding: 0;
	}  #page {
		width: 700px;
		height: auto;
		background: #1F1515;
		border: 1px solid dimgray;
		box-shadow: 2px 3px 6px gray;
		margin: 0 auto;
		padding-bottom: 16px;
	} main {
		width: 618px;
		height: 646px;
		margin: 0 auto;
		display: grid;
		grid-gap: 6px;
		grid-template-columns: repeat(3, 200px);
		grid-template-rows: 320px 320px;
	} main img {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	} main img:nth-child(1) {
		grid-area: 1/2/2/3;
	} main img:nth-child(2) {
		grid-area: 1/1/2/2;
	} main img:nth-child(3) {
		grid-area: 2/2/3/3;
	} main img:nth-child(4) {
		grid-area: 2/1/3/2;
	} main img:nth-child(5) {
		grid-area: 2/2/3/3;
	} main img:nth-child(6) {
		grid-area: 1/3/3/4;
	} main img:nth-child(7) {
		grid-area: 2/3/3/4;
	} h1 {
		color: antiquewhite;
		text-align: center;
		padding: 20px auto;
		font-size: 70pt;
		font-family: Impact, Haettenschweiler, 'Franklin Gothic Bold', 'Arial Black', 'sans-serif'
	} table {
		margin: 0 auto 24px;
		width: 640px;
		font: 9pt/1.2em Consolas, "Andale Mono", "Lucida Console", "Lucida Sans Typewriter", Monaco, "Courier New", "monospace";
		border-collapse: collapse;
		border: 1px solid dimgray;
	} td, th {
		padding: 3px 12px;
		color: antiquewhite;
		border: 1px solid dimgray;
    } tr:nth-child(odd) {
        background: rgba(255,255,255,0.40);
    } tr:nt-child(2) {
        background: #8A8A8A;
        position: sticky;
        top: 0;
	} #print-btn {
		display: block;
		margin: 4px auto 0;
	}
</style>
<script language="javascript" type="text/javascript">
	function printPage() {
		window.print();
	}
</script>
</head>

<body>
	<div id="page">
		<header>
			<h1> Photography </h1>
		</header>
		<main>
			<img src="Dog.png" />
			<img src="plane.png" />
			<img src="rabbit.png" />
			<img src="rock.jpg" />
			<img src="rabbit.png" />
			<img src= "flower.png" />
			<img src= "unlv.jpg" />
		</main>
	<button id="print-btn" onClick="printPage()">Print Page</button>
	
	</div>
</body>
</html>
