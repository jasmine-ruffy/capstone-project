<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title> Art Works </title>
<style>
	body {
		background: white;
	} * {
		margin: 0;
		padding: 0;
	}  #page {
		width: 700px;
		height: auto;
		background: #1F1515;
		border: 1px solid dimgray;
		box-shadow: 2px 3px 6px gray;
		margin: 0 auto;
		padding-bottom: 16px;
	} main {
		width: 618px;
		height: 646px;
		margin: 0 auto;
		display: grid;
		grid-gap: 6px;
		grid-template-columns: repeat(3, 200px);
		grid-template-rows: 320px 320px;
	} main figure {
		width: 100%;
		height: 100%;
		position: relative;
		display: flex;
		flex-direction: column;
	} main img {
		width: 100%;
		height: 100%;
		flex: 1;
		object-fit: cover;
		display: block;
	} figcaption {
		position: absolute;
		bottom: 0;
		width: 100%;
		text-align: center;
		background: rgba (0,0,0,0.5);
		color: antiquewhite;
		font-size: 9pt;
		padding: 4px 0;
		flex-shrink: 0;
	} main img:nth-child(1) {
		grid-area: 1/2/2/3;
	} main img:nth-child(2) {
		grid-area: 1/1/2/2;
	} main img:nth-child(3) {
		grid-area: 2/2/3/3;
	} main img:nth-child(4) {
		grid-area: 2/1/3/2;
	} main img:nth-child(5) {
		grid-area: 2/2/3/3;
	} main img:nth-child(6) {
		grid-area: 1/3/3/4;
	} main img:nth-child(7) {
		grid-area: 2/3/3/4;
	} h1 {
		color: antiquewhite;
		text-align: center;
		padding: 20px auto;
		font-size: 70pt;
		font-family: Impact, Haettenschweiler, 'Franklin Gothic Bold', 'Arial Black', 'sans-serif'
	} #print-btn {
		display: block;
		margin: 4px auto 0;
	}
</style>
<script language="javascript" type="text/javascript">
	function printPage() {
		window.print();
	}
</script>
</head>

<body>
	<div id="page">
		<header>
			<h1> Art Works </h1>
		</header>
		<main>
			<figure><img src="digital.png" /><figcaption>Digital</figcaption></figure>
			<figure><img src="monkey.png" /><figcaption>Soft Pastels</figcaption></figure>
			<figure><img src="mono.png" /><figcaption>Soft Pastels</figcaption></figure>
			<figure><img src="sky.png" /><figcaption>Soft Pastels</figcaption></figure>
			<figure><img src= "graphite.jpg" /><figcaption>Graphite</figcaption></figure>
			<figure><img src="fox.jpg" /><figcaption>Ink</figcaption></figure>
		</main>
	<button id="print-btn" onClick="printPage()">Print Page</button>
	
	</div>
</body>
</html>
