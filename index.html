<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>graphic</title>
<style>
	body {
		background: #1F1515;
		margin: 0;
		padding: 20px;
	} #page {
		width: 700px;
		margin: 0 auto;
	} h1 {
		color: antiquewhite;
		text-align: center;
		padding: 20px 0;
		font-size: 70pt;
		font-family: Impact, Haettenschweiler, "Franklin Gothic Bold", "Arial Black", "sans-serif";
	} img {
		width: 100%;
		display: block;
		box-shadow: 2px 3px 6px black;
	} summary {
		cursor: pointer;
		color: antiquewhite;
		font-size: 14pt;
		padding: 8px 12px;
		background: #2F3629;
		list-style: none;
	} summary:hover {
		background: #3d4a33;
	} details {
		margin: 20px auto;
		width: 700px;
		border: 1px solid dimgray;
	} details[open] summary {
		border-bottom: 1px solid dimgray;
	} details p {
		color: antiquewhite;
		padding: 8px 12px;
		font-size: 11pt;
	}
</style>
</head>
<body>
	<div id="page">
		<h1> Graphic Design </h1>
		<img src="cat.png"/>
		<details>
			<summary> Assignment 1 </summary>
			<p> To create a simple web page with hypertext markup language (HTML) tags and cascading style sheet (CSS) styles that includes text and an image. </p>
		</details>
		<img src="monkeys.png"/>
		<details>
			<summary> Assignment 8 </summary>
			<p> To create a type sample page to show fonts with one or more images </p>
		</details>
	
	</div>
</body>
</html>
